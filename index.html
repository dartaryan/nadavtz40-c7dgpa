<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>נדבץ' בן 40</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#722F37;
  --cream:#FFF9EE;
  --ink:#23202B;
  --teal:#0E7490;
  --mustard:#E8A33D;
  --olive:#5A7247;
  --shadow:6px 6px 0 var(--ink);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Rubik','Segoe UI',Arial,sans-serif;
  background:var(--cream);
  color:var(--ink);
  overflow:hidden;
  background-image:
    radial-gradient(circle at 12% 18%, rgba(14,116,144,.10) 0 90px, transparent 91px),
    radial-gradient(circle at 88% 80%, rgba(232,163,61,.13) 0 130px, transparent 131px),
    radial-gradient(circle at 80% 12%, rgba(114,47,55,.08) 0 70px, transparent 71px),
    radial-gradient(circle at 18% 85%, rgba(90,114,71,.10) 0 100px, transparent 101px);
}
.screen{
  position:absolute; inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:4vh 6vw 14vh;
  text-align:center;
  gap:3vh;
}
.screen.active{display:flex;animation:popIn .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{0%{opacity:0;transform:scale(.92) translateY(26px)}100%{opacity:1;transform:scale(1) translateY(0)}}

h1{font-size:clamp(48px,8vw,108px);font-weight:900;color:var(--wine);line-height:1.05}
h2{font-size:clamp(34px,5vw,64px);font-weight:900;color:var(--wine)}
p.lead{font-size:clamp(22px,2.6vw,36px);max-width:1100px;line-height:1.45}
.tag{
  display:inline-block;background:var(--mustard);border:3px solid var(--ink);
  box-shadow:var(--shadow);border-radius:14px;padding:.35em 1em;
  font-weight:700;font-size:clamp(18px,2vw,28px);transform:rotate(-2deg);
}
.card{
  background:#fff;border:3px solid var(--ink);border-radius:16px;
  box-shadow:var(--shadow);padding:3.2vh 3vw;max-width:1200px;
}
.btn{
  font-family:inherit;font-size:clamp(20px,2.4vw,32px);font-weight:700;
  background:var(--teal);color:#fff;border:3px solid var(--ink);
  border-radius:14px;box-shadow:var(--shadow);padding:.55em 1.4em;
  cursor:pointer;transition:transform .12s, box-shadow .12s;
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.btn.wine{background:var(--wine)}
.btn.mustard{background:var(--mustard);color:var(--ink)}
.btn.olive{background:var(--olive)}
.btn.ghost{background:#fff;color:var(--ink)}

/* nav */
.nav{
  position:fixed;bottom:2.4vh;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:0 3vw;z-index:50;
}
.nav .btn{font-size:clamp(18px,2vw,26px)}
#progress{
  font-weight:500;font-size:clamp(14px,1.4vw,20px);
  background:#fff;border:3px solid var(--ink);border-radius:999px;
  padding:.3em 1.1em;box-shadow:4px 4px 0 var(--ink);
}

/* welcome */
.hero-photo{
  width:clamp(180px,24vw,320px);height:clamp(180px,24vw,320px);
  object-fit:cover;border:4px solid var(--ink);border-radius:24px;
  box-shadow:var(--shadow);transform:rotate(2.5deg);
  animation:floaty 3.4s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:rotate(2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-12px)}}
.badge40{
  position:absolute;font-weight:900;color:#fff;background:var(--wine);
  border:4px solid var(--ink);border-radius:50%;box-shadow:var(--shadow);
  width:clamp(90px,10vw,150px);height:clamp(90px,10vw,150px);
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(36px,4.4vw,64px);
  top:10vh;left:12vw;transform:rotate(-9deg);
  animation:wiggle 2.6s ease-in-out infinite;
}
@keyframes wiggle{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(-2deg)}}

/* true/false */
.statements{display:flex;flex-direction:column;gap:2.2vh;width:min(94vw,1250px)}
.stmt{
  background:#fff;border:3px solid var(--ink);border-radius:16px;
  box-shadow:var(--shadow);padding:2.2vh 2vw;
  font-size:clamp(20px,2.5vw,34px);font-weight:500;line-height:1.4;
  cursor:pointer;display:flex;align-items:center;gap:1.2vw;text-align:right;
  transition:transform .15s;
}
.stmt:hover{transform:translate(-3px,-3px)}
.stmt .num{
  flex:0 0 auto;width:1.9em;height:1.9em;border-radius:50%;
  border:3px solid var(--ink);background:var(--mustard);
  display:flex;align-items:center;justify-content:center;font-weight:900;
}
.stmt.truth{background:#e7f6ec;border-color:var(--olive);animation:pulseTrue .6s ease 2}
.stmt.truth .num{background:var(--olive);color:#fff}
.stmt.lie{opacity:.45;text-decoration:line-through;animation:shake .4s ease 1}
@keyframes pulseTrue{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.reveal-story{
  display:none;background:var(--mustard);border:3px solid var(--ink);
  border-radius:14px;box-shadow:var(--shadow);padding:1.6vh 2vw;
  font-size:clamp(18px,2.1vw,30px);font-weight:500;max-width:1100px;
  transform:rotate(-1deg);
}
.reveal-story.show{display:block;animation:popIn .5s ease}
.round-label{font-size:clamp(20px,2.2vw,30px);font-weight:700;color:var(--teal)}

/* video */
.video-wrap{
  width:min(92vw,1300px);aspect-ratio:16/9;background:#000;
  border:4px solid var(--ink);border-radius:18px;box-shadow:var(--shadow);
  overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;
}
.video-wrap iframe,.video-wrap video{width:100%;height:100%;border:0}

/* timer */
#timerDisplay{
  font-size:clamp(110px,22vw,300px);font-weight:900;color:var(--wine);
  line-height:1;font-variant-numeric:tabular-nums;
}
#timerDisplay.running{animation:beat 1s ease-in-out infinite}
#timerDisplay.urgent{color:#b3261e;animation:beat .5s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.scoreboard{display:flex;gap:4vw;flex-wrap:wrap;justify-content:center}
.team{
  background:#fff;border:3px solid var(--ink);border-radius:18px;
  box-shadow:var(--shadow);padding:2vh 2.6vw;min-width:min(38vw,330px);
}
.team h3{font-size:clamp(24px,2.6vw,38px);font-weight:900}
.team.a h3{color:var(--teal)} .team.b h3{color:var(--mustard)}
.team .score{font-size:clamp(54px,7vw,110px);font-weight:900;line-height:1.1}
.team .controls{display:flex;gap:1vw;justify-content:center}
.team .controls .btn{font-size:clamp(22px,2.4vw,34px);padding:.15em .8em}

/* finale */
.finale-photo{
  max-width:min(78vw,860px);max-height:54vh;
  border:4px solid var(--ink);border-radius:20px;
  box-shadow:var(--shadow);
  animation:popIn .8s cubic-bezier(.2,1.4,.4,1);
}

/* confetti */
.confetti{
  position:fixed;top:-20px;z-index:200;pointer-events:none;
  width:14px;height:14px;border:2px solid var(--ink);
  animation:fall linear forwards;
}
@keyframes fall{
  0%{transform:translateY(0) rotate(0)}
  100%{transform:translateY(110vh) rotate(720deg)}
}

ul.rules{list-style:none;display:flex;flex-direction:column;gap:1.6vh;font-size:clamp(20px,2.4vw,32px);text-align:right;max-width:1050px}
ul.rules li{display:flex;gap:.7em;align-items:baseline}
ul.rules li::before{content:"";flex:0 0 .55em;height:.55em;background:var(--teal);border:2px solid var(--ink);border-radius:3px;transform:rotate(45deg)}
ul.rules li:nth-child(2)::before{background:var(--mustard)}
ul.rules li:nth-child(3)::before{background:var(--olive)}
ul.rules li:nth-child(4)::before{background:var(--wine)}
ul.rules li:nth-child(5)::before{background:var(--teal)}
.muted{opacity:.65;font-size:clamp(15px,1.5vw,21px)}
</style>
</head>
<body>

<div class="nav">
  <button class="btn ghost" id="btnPrev">→ הקודם</button>
  <div id="progress"></div>
  <button class="btn wine" id="btnNext">הבא ←</button>
</div>

<div id="app"></div>

<script>
/* ====== CONFIG - דברים שמחליפים בקלות ====== */
const CONFIG = {
  youtubeId: "",                              // מזהה הסרטון ביוטיוב - מדביקים כאן כשהסרטון עולה
  localVideo: "assets/video/nadav-40.mp4",    // גיבוי מקומי אם אין יוטיוב/אינטרנט
  perfectPictureAudio: "assets/audio/perfect-picture.mp3",
  timerSeconds: 50
};

/* ====== נתוני אמת/שקר ====== */
const ROUNDS = [
 { label:"סבב 1 - השקיות", truth:1, reveal:"עד היום הוא מוצא מקומות יצירתיים \"להזיז\" אליהם את השקיות בלי לזרוק.",
   stmts:["נדב בנה מתקן מעוצב לשקיות במטבח, עם תא נפרד לכל גודל של שקית",
          "נדב זרק את כל אוסף השקיות של אילנית לפח, והיא הלכה והחזירה אותו מהזבל",
          "נדב מבריח חלק מהשקיות לפח של השכנים, כמה שקיות בכל פעם כדי שלא ירגישו"]},
 { label:"סבב 2 - אלקסה", truth:2, reveal:"גם באמצע הלילה. וכל ערב הוא אומר good night וכל האורות בבית נכבים.",
   stmts:["נדב חיבר את אלקסה למכונת הקפה, והיא מכינה לו אספרסו בפקודה קולית מהמיטה",
          "נדב לימד את אלקסה לזהות רק את הקול שלו, והיא מתעלמת בעקביות מאילנית",
          "כשאילנית לא עונה לטלפון, נדב מתחבר מרחוק לאלקסה ומדבר אליה בחלל החדר"]},
 { label:"סבב 3 - גיל 15", truth:1, reveal:"שני נערים בני 15, לבד, במדינה זרה. שנות התשעים. ההורים אישרו.",
   stmts:["בגיל 15 נדב הגיע למקום שלישי באליפות בתי הספר של סינגפור בשחייה",
          "בגיל 15 נדב נסע לבד למלזיה עם אנדריי, החבר הכי טוב שלו מדנמרק",
          "בגיל 15 נדב צולם לפרסומת בטלוויזיה הסינגפורית והרוויח את משכורתו הראשונה"]},
 { label:"סבב 4 - נאום החתונה", truth:2, reveal:"החברים לא שכחו, ולא יישכחו לעולם.",
   stmts:["נדב הכין לנאום החתונה מצגת פאוורפוינט עם גרפים על התפתחות הקשר",
          "בנאום החתונה נדב שכח לרגע את השם של אבא של אילנית, מול כל האולם",
          "נדב פתח את נאום החתונה שלו בשלוש מילים בדיוק: \"אילנית. חתונה. וואו\""]},
 { label:"סבב 5 - משקפי השמש", truth:1, reveal:"זה קרה. זה היה devastating. כמעט אין תמונה שלו בלי המשקפיים.",
   stmts:["לנדב יש זוג רייבאן אחד כבר חמש עשרה שנים, והוא מעולם לא איבד אותו",
          "לנדב יש כמה זוגות רייבאן זהים, גיבוי למקרה האסון שבו זוג הולך לאיבוד",
          "נדב מסרב להרכיב משקפי שמש בטיולים, כי הם משאירים לו סימני שיזוף מביכים"]},
 { label:"סבב 6 - ירמי והחנות", truth:2, reveal:"ירמי. דינוזאור. אגדה. מי שעבד שם יודע שאסור לשאול על שנת הצהריים.",
   stmts:["ירמי השעה את נדב מהחנות לשבוע שלם, אחרי שנתן הנחות לכל החברים שלו",
          "ירמי העניק לנדב שלוש פעמים ברצף את תואר עובד החודש של חנות מצוק",
          "כשהדס התקשרה לחנות ריקה לגמרי, ירמי ענה: \"אני עם אנשים, תפסיקי לבלבל לי במוח\""]},
 { label:"סבב 7 - באר שבע", truth:1, reveal:"דור נשאר חבר עד היום. הקיר - פחות.",
   stmts:["נדב ודור גידלו במרפסת הדירה תרנגולת, שהטילה להם ביצים לארוחת הבוקר",
          "בדירה בבאר שבע היה קיר כל כך דק, ששמעו דרכו הכל והיה על זה שיח ער",
          "נדב ודור התחלפו בחדרים כל חודש, אחרי שדור טען שהחדר שלו קטן יותר"]},
 { label:"סבב 8 - קוטג' וגבינות", truth:0, reveal:"סנוב של קפה, יין, וויסקי וגבינות מסריחות - אבל קוטג' זה קוטג'.",
   stmts:["נדב מסוגל להתקיים מקוטג' בלבד כל החיים, וזה פחות או יותר מה שהוא עושה",
          "נדב נשבע לא לגעת בגבינה צהובה פשוטה, כי זה פוגע בכבודו של לוח הגבינות",
          "נדב מיישן גבינות בוטיק בפינה ייעודית במקרר, בתהליך של שלושה חודשים"]},
 { label:"סבב 9 - הנעליים", truth:0, reveal:"הכל ברפוט. הכל. תבדקו בכניסה.",
   stmts:["נדב החליף את כל הנעליים שלו לנעלי ברפוט: יומיום, סניקרס וגם נעלי טיולים",
          "נדב מזמין נעליים בהתאמה אישית מסנדלר באיטליה, לפי מידות שלקח בעצמו",
          "נדב שומר את כל קופסאות הנעליים שקנה אי פעם, מסודרות לפי תאריך בבוידעם"]},
 { label:"סבב 10 - סבב הסיום", truth:1, reveal:"כולם התגלגלו מצחוק. עד היום אף אחד לא יודע למה היא עשתה את זה.",
   stmts:["בחתונה של נדב, שייקה זינק ותפס באוויר את הזר שאילנית זרקה לרווקות",
          "ענבל נתנה לשייקה פליק בטוסיק בדלת של אלונזו, והתנהגה כאילו זה טבעי לגמרי",
          "אלונזו ושייקה החליפו מעילים בטעות במסיבה, ולא שמו לב במשך חודש שלם"]}
];

const PHOTOS = [
 "char-1","char-2","char-3","char-4","char-5","char-6","char-7","char-8","char-9","char-10",
 "obj-1","obj-2","obj-3","obj-4","obj-5","obj-6","obj-7","obj-8","obj-9",
 "place-1","place-2","place-3","place-4","place-5","place-6","place-7","place-8","place-9","place-10","place-11","place-12"
].map(n=>`assets/photos/TP-2026-00040-${n}.png`);

/* ====== סאונד ====== */
const SFX = {};
["click","correct","wrong","win","timeup","welcome"].forEach(n=>{
  SFX[n] = new Audio(`assets/sfx/${n}.ogg`); SFX[n].volume = .55;
});
function play(n){ try{ SFX[n].currentTime=0; SFX[n].play(); }catch(e){} }

/* ====== קונפטי ====== */
const CONF_COLORS = ["#722F37","#0E7490","#E8A33D","#5A7247","#fff"];
function confetti(n=60){
  for(let i=0;i<n;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left = Math.random()*100+"vw";
    c.style.background = CONF_COLORS[i%CONF_COLORS.length];
    c.style.borderRadius = Math.random()>.5?"50%":"3px";
    c.style.animationDuration = (2.2+Math.random()*2)+"s";
    c.style.animationDelay = (Math.random()*0.6)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),5200);
  }
}

/* ====== בניית המסכים ====== */
const app = document.getElementById("app");
const screens = [];
function addScreen(html){
  const s=document.createElement("section");
  s.className="screen"; s.innerHTML=html;
  app.appendChild(s); screens.push(s); return s;
}

/* פתיחה */
addScreen(`
  <div class="badge40">40</div>
  <img class="hero-photo" src="${PHOTOS[0]}" alt="נדב">
  <h1>נדבץ' בן 40</h1>
  <p class="lead">ערב אחד, ארבעה משחקים, אפס רחמים.</p>
  <span class="tag">מתחילים? לוחצים "הבא"</span>
`);

/* חוקי אמת/שקר */
addScreen(`
  <h2>משחק ראשון: אמת או צ'יזבט?</h2>
  <div class="card"><ul class="rules">
    <li>על המסך יופיעו 3 משפטים על נדב</li>
    <li>רק אחד מהם נכון. השניים האחרים - צ'יזבט מוחלט</li>
    <li>מצביעים: כל אחד בוחר מספר (1, 2 או 3) באצבעות</li>
    <li>לוחצים על המשפט שנבחר - והאמת נחשפת</li>
    <li>נדב כמובן יתקן ויספר איך זה באמת היה</li>
  </ul></div>
`);

/* סבבי אמת/שקר */
ROUNDS.forEach((r,ri)=>{
  const s=addScreen(`
    <div class="round-label">${r.label} <span class="muted">(${ri+1}/${ROUNDS.length})</span></div>
    <h2>איזה משפט נכון?</h2>
    <div class="statements">
      ${r.stmts.map((t,i)=>`<div class="stmt" data-i="${i}"><span class="num">${i+1}</span><span>${t}</span></div>`).join("")}
    </div>
    <div class="reveal-story">${r.reveal}</div>
  `);
  let done=false;
  s.querySelectorAll(".stmt").forEach(el=>{
    el.addEventListener("click",()=>{
      if(done) return; done=true;
      const picked = +el.dataset.i;
      s.querySelectorAll(".stmt").forEach(e2=>{
        const i=+e2.dataset.i;
        e2.classList.add(i===r.truth?"truth":"lie");
      });
      s.querySelector(".reveal-story").classList.add("show");
      if(picked===r.truth){ play("correct"); confetti(70); }
      else { play("wrong"); setTimeout(()=>{play("correct");confetti(40);},700); }
    });
  });
});

/* מעבר לסרטון */
addScreen(`
  <h2>יש כל מיני דרכים לספר על נדב...</h2>
  <p class="lead">שבו נוח. תקשיבו טוב - תכף תצטרכו לזכור את כל זה.</p>
  <div class="video-wrap" id="videoWrap"><p style="font-size:28px;padding:20px">הסרטון נטען...</p></div>
`);

/* חוקי פנטומימה */
addScreen(`
  <h2>משחק שני: נדב בתנועות</h2>
  <div class="card"><ul class="rules">
    <li>מתחלקים לשתי קבוצות</li>
    <li>נציג מרים פתק ומציג בפנטומימה - בלי מילים, בלי קולות</li>
    <li>הקבוצה מנחשת. ניחשתם? מרימים פתק חדש</li>
    <li>50 שניות לכל תור - כמה שיותר פתקים</li>
    <li>כל הפתקים הם דברים מהסרטון שראיתם הרגע</li>
  </ul></div>
  <span class="tag">הפתקים אצל אילנית - לגזור מראש</span>
`);

/* טיימר + ניקוד */
addScreen(`
  <div id="timerDisplay">${CONFIG.timerSeconds}</div>
  <div style="display:flex;gap:2vw;flex-wrap:wrap;justify-content:center">
    <button class="btn wine" id="timerStart">התחל 50 שניות</button>
    <button class="btn ghost" id="timerReset">איפוס</button>
  </div>
  <div class="scoreboard">
    <div class="team a"><h3>קבוצה א'</h3><div class="score" id="scoreA">0</div>
      <div class="controls"><button class="btn olive" data-t="A" data-d="1">+</button><button class="btn ghost" data-t="A" data-d="-1">-</button></div></div>
    <div class="team b"><h3>קבוצה ב'</h3><div class="score" id="scoreB">0</div>
      <div class="controls"><button class="btn olive" data-t="B" data-d="1">+</button><button class="btn ghost" data-t="B" data-d="-1">-</button></div></div>
  </div>
`);

/* התמונה המושלמת */
addScreen(`
  <h2>משחק שלישי: התמונה המושלמת</h2>
  <p class="lead">כל אחד מקבל דף וצבעים. תכף תשמעו תיאור של התמונה המושלמת של נדב בן 40 - וכל אחד מצייר את מה שהוא שומע. בסוף משווים. אמנות אמיתית לא נשפטת. (היא כן.)</p>
  <div class="card" style="display:flex;flex-direction:column;gap:2vh;align-items:center">
    <audio id="ppAudio" controls preload="auto" style="width:min(80vw,800px)">
      <source src="${CONFIG.perfectPictureAudio}" type="audio/mpeg">
    </audio>
    <button class="btn mustard" id="ppReplay">השמע מההתחלה</button>
  </div>
`);

/* ברכות ל-50 */
addScreen(`
  <h2>ולסיום...</h2>
  <p class="lead">כל אחד הופך את הציור שלו וכותב מאחורה ברכה של שורה אחת:<br><b>"נדב בן 50 יהיה..."</b></p>
  <p class="lead">אוספים את כל הציורים לערימה אחת. נדב פותח אותה שוב בעוד עשר שנים בדיוק.</p>
  <span class="tag">קפסולת זמן. בלי לרמות.</span>
`);

/* סיום */
addScreen(`
  <h1>לחיי נדבץ'!</h1>
  <img class="finale-photo" id="finalePhoto" src="assets/photos/nadav-40-party.png" alt="נדב חוגג 40">
  <p class="lead">40 שנה של קפה טוב, יין טוב וחברים מצוינים. שיהיו עוד 40 לפחות.</p>
`);

/* ====== ניווט ====== */
let cur = 0;
const progress = document.getElementById("progress");
function show(i){
  if(i<0||i>=screens.length) return;
  screens[cur].classList.remove("active");
  cur=i;
  screens[cur].classList.add("active");
  progress.textContent = `${cur+1} / ${screens.length}`;
  if(cur===0) play("welcome"); else play("click");
  if(screens[cur].querySelector("#videoWrap")) mountVideo();
  if(screens[cur].querySelector("#finalePhoto")) celebrateFinale();
}
document.getElementById("btnNext").addEventListener("click",()=>show(cur+1));
document.getElementById("btnPrev").addEventListener("click",()=>show(cur-1));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key===" "||e.key==="PageDown") show(cur+1);   /* RTL: שמאלה = קדימה */
  if(e.key==="ArrowRight"||e.key==="PageUp") show(cur-1);
});

/* ====== וידאו ====== */
let videoMounted=false;
function mountVideo(){
  if(videoMounted) return; videoMounted=true;
  const w=document.getElementById("videoWrap");
  if(CONFIG.youtubeId){
    w.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${CONFIG.youtubeId}?rel=0&modestbranding=1&hl=he" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  }else{
    w.innerHTML=`<video controls preload="metadata"><source src="${CONFIG.localVideo}" type="video/mp4"></video>
      <p style="position:absolute;color:#fff;font-size:20px;pointer-events:none;opacity:.0"></p>`;
    const v=w.querySelector("video");
    v.addEventListener("error",()=>{ w.innerHTML=`<p style="font-size:26px;padding:24px">הסרטון עוד לא חובר - מדביקים את מזהה היוטיוב ב-CONFIG בראש הקובץ</p>`; });
  }
}

/* ====== טיימר ====== */
let timerInt=null, timeLeft=CONFIG.timerSeconds;
const tDisp=()=>document.getElementById("timerDisplay");
document.addEventListener("click",e=>{
  if(e.target.id==="timerStart"){
    clearInterval(timerInt); timeLeft=CONFIG.timerSeconds;
    const d=tDisp(); d.textContent=timeLeft; d.classList.add("running"); d.classList.remove("urgent");
    play("click");
    timerInt=setInterval(()=>{
      timeLeft--;
      d.textContent=timeLeft;
      if(timeLeft<=10) d.classList.add("urgent");
      if(timeLeft<=0){
        clearInterval(timerInt);
        d.textContent="0"; d.classList.remove("running","urgent");
        play("timeup"); setTimeout(()=>play("win"),500); confetti(50);
      }
    },1000);
  }
  if(e.target.id==="timerReset"){
    clearInterval(timerInt); timeLeft=CONFIG.timerSeconds;
    const d=tDisp(); d.textContent=timeLeft; d.classList.remove("running","urgent");
    play("click");
  }
  if(e.target.dataset && e.target.dataset.t){
    const id="score"+e.target.dataset.t;
    const el=document.getElementById(id);
    el.textContent = Math.max(0, (+el.textContent) + (+e.target.dataset.d));
    play(e.target.dataset.d==="1"?"correct":"click");
    if(e.target.dataset.d==="1") confetti(14);
  }
  if(e.target.id==="ppReplay"){
    const a=document.getElementById("ppAudio");
    a.currentTime=0; a.play(); play("click");
  }
});

/* ====== סיום ====== */
let finaleDone=false;
function celebrateFinale(){
  if(finaleDone) return; finaleDone=true;
  confetti(110); play("win");
}

/* התחלה */
show(0);
</script>
</body>
</html>
